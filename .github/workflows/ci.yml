name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: libislet
      run_tests: true
      publish_to: "deb,apk,rpm,pacman,brew,openbsd,winget"
      deps: "libcorm"
      deps_deb: "libstele,libcorm,libxxhash-dev"
      deps_apk: "libstele,libcorm,xxhash-dev"
      deps_rpm: "libstele,libcorm,xxhash-devel"
      deps_pacman: "libstele,libcorm,xxhash"
      deps_brew: "libstele,libcorm,xxhash"
      deps_openbsd: "libstele,libcorm,xxhash"
      deps_winget: "mingw-w64-x86_64-xxhash,mingw-w64-x86_64-mman-win32"
      deps_winget_tty: "libstele,libcorm"
    secrets: inherit
